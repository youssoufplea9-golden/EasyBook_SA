version: "3.9"

services:
  # ── PostgreSQL ───────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: easybook_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: easybook_db
      POSTGRES_USER: easybook
      POSTGRES_PASSWORD: easybook_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easybook -d easybook_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── FastAPI Backend ──────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: easybook_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://easybook:easybook_secret@db:5432/easybook_db
      DATABASE_URL_SYNC: postgresql://easybook:easybook_secret@db:5432/easybook_db
      SECRET_KEY: c3ab8ff13720e8ad9047dd39466b3c8974e592c2fa383d4a3960714caef0c4f2
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      FIRST_ADMIN_EMAIL: admin@easybook.io
      FIRST_ADMIN_PASSWORD: Admin@1234
      OPEN_LIBRARY_API_URL: https://openlibrary.org
      GOOGLE_BOOKS_API_KEY: ""
      ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000"
      APP_NAME: EasyBook
      APP_ENV: development
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # ── React Frontend ───────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: easybook_frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
      VITE_APP_NAME: EasyBook
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
    driver: local
